[mcp_servers.ai_writing_assistance]
# Set `AI_WRITING_WORK=work_id_1` before launching Codex to bind this STDIO MCP server to that database.
command = "../venv/bin/python"
args = ["-u", "../services/codex_mcp/server.py"]
cwd = "."
startup_timeout_sec = 10
tool_timeout_sec = 120

[mcp_servers.ai_writing_assistance.tools.writing_lookup]
approval_mode = "approve"

[mcp_servers.ai_writing_assistance.tools.get_chapter_summary]
approval_mode = "approve"

[mcp_servers.ai_writing_assistance.tools.get_raw_paragraph]
approval_mode = "approve"

[mcp_servers.ai_writing_assistance.tools.search_summary_by_tags]
approval_mode = "approve"

[mcp_servers.ai_writing_assistance.tools.get_chapter_text]
approval_mode = "approve"
